<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Ubicaciones</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Rastreo de Ubicaciones</h1>
            <div class="controls">
                <select id="deviceSelect">
                    <option value="">Seleccione dispositivo...</option>
                </select>
                
                <div class="date-range">
                    <label for="startDate">Desde:</label>
                    <input type="datetime-local" id="startDate">
                    
                    <label for="endDate">Hasta:</label>
                    <input type="datetime-local" id="endDate">
                    
                    <button id="searchButton">Buscar</button>
                </div>
            </div>
            <div class="tracking-controls">
                <div class="switch-container">
                  <label class="switch">
                    <input type="checkbox" id="trackingSwitch">
                    <span class="slider round"></span>
                  </label>
                  <span class="switch-label">Seguimiento en tiempo real</span>
                </div>
                
                <div class="interval-controls">
                  <label for="trackingInterval">Intervalo (segundos):</label>
                  <input type="number" id="trackingInterval" min="1" max="60" value="5">
                </div>
                
                <div class="status-indicator" id="trackingStatus">
                  Inactivo
                </div>
              </div>
        </header>
        
        <div class="content">
            <div id="map"></div>
            
            <div class="sidebar">
                <div class="stats-panel">
                    <h3>Estadísticas</h3>
                    <div id="stats-content">
                        <p>Cargando estadísticas...</p>
                    </div>
                </div>
                
                <div class="route-history">
                    <h3>Historial de Rutas</h3>
                    <div id="route-history-content">
                        <p>Seleccione un dispositivo para ver su historial</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Scripts personalizados -->
    <script src="js/map.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
