<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Rastreo de Ubicaciones</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Sistema de Rastreo de Ubicaciones</h1>
      <div id="connectionStatus" class="status-badge status-disconnected">
        Desconectado
      </div>
    </header>

    <div class="container">
      <div class="sidebar">
        <div class="control-panel">
          <h2>Controles</h2>

          <div class="form-group">
            <label for="deviceSelect">Dispositivo:</label>
            <select id="deviceSelect">
              <option value="">Selecciona un dispositivo</option>
            </select>
          </div>

          <div class="date-range">
            <div class="form-group">
              <label for="startDate">Desde:</label>
              <input type="datetime-local" id="startDate" />
            </div>
            <div class="form-group">
              <label for="endDate">Hasta:</label>
              <input type="datetime-local" id="endDate" />
            </div>
          </div>

          <button id="searchButton" class="btn btn-primary">
            Ver Flota Completa
          </button>

          <div class="form-group toggle-container">
            <label for="realTimeToggle">Seguimiento en tiempo real:</label>
            <label class="switch">
              <input type="checkbox" id="realTimeToggle" />
              <span class="slider"></span>
            </label>
          </div>

          <div class="form-group">
            <label for="interval">Intervalo (segundos):</label>
            <input type="number" id="interval" min="1" value="5" />
          </div>
        </div>

        <div class="device-list-container">
          <h2>Dispositivos Activos</h2>
          <ul id="activeDevices" class="active-devices-list">
            <li class="no-devices">Cargando dispositivos...</li>
          </ul>
        </div>

        <div class="stats-container">
          <h2>Estadísticas</h2>
          <div id="statsContent">
            <p>Total de ubicaciones: <span id="totalLocations">0</span></p>
            <p>
              Ubicaciones recientes (30 días):
              <span id="recentLocations">0</span>
            </p>
            <p>
              Dispositivos registrados: <span id="registeredDevices">0</span>
            </p>
            <p>Última actualización: <span id="lastUpdate">N/A</span></p>
          </div>
        </div>
      </div>

      <div class="main-content">
        <div id="map"></div>
      </div>
    </div>

    <footer>
      <p>&copy; 2025 - Sistema de Rastreo de Ubicaciones</p>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="/js/websocket-client.js"></script>
    <script src="/js/map.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/deviceHistory.js"></script>
  </body>
</html>
